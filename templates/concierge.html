<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Консьерж — Сервисы Ходынки</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Montserrat", sans-serif;
      background-color: #f5f6f7;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .cover {
      height: 35vh;
      min-height: 220px;
      background: linear-gradient(180deg, #4b73ff 0%, #66a3ff 100%);
      border-radius: 0 0 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .cover h1 {
      font-size: 1.8rem;
      margin: 0;
      font-weight: 700;
    }

    .cover p {
      font-size: 0.9rem;
      opacity: 0.95;
      margin-top: 6px;
    }

    .main-block {
      background: white;
      border-radius: 30px;
      padding: 30px 20px 60px;
      margin: -50px 15px 40px;
      position: relative;
      z-index: 1;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 16px;
      color: #333;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      margin-top: 6px;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #4b73ff;
      box-shadow: 0 0 0 3px rgba(75, 115, 255, 0.15);
    }

    .submit-btn {
      width: 100%;
      background: #4b73ff;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 0 6px 16px rgba(75, 115, 255, 0.25);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      box-shadow: 0 10px 22px rgba(75, 115, 255, 0.3);
    }

    .success-message {
      display: none;
      text-align: center;
      margin-top: 25px;
      font-weight: 600;
      color: #00bb5a;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="cover">
      <h1>🛎️ Консьерж</h1>
      <p>Оставьте заявку или сообщение для консьержа</p>
    </div>

    <div class="main-block">
      <form id="conciergeForm">
      <label for="name">Ваше имя</label>
      <input type="text" id="name" placeholder="Введите имя" required>

      <label for="apartment">Квартира</label>
        <input type="text" id="apartment" placeholder="Например: 142" required>

        <label for="service">Тип обращения</label>
        <select id="service" required>
          <option disabled selected>Выберите тип</option>
          <option>Сообщение о доставке</option>
        </select>

        <label for="comment">Комментарий</label>
        <textarea id="comment" rows="3" placeholder="Опишите, что нужно сделать"></textarea>

        <button type="submit" class="submit-btn">Отправить заявку</button>
      </form>

      <div class="success-message" id="successMsg">✅ Заявка отправлена!</div>
    </div>
  </div>

<script>
  const form = document.getElementById('conciergeForm');
  const successMsg = document.getElementById('successMsg');

  form.addEventListener('submit', (e) => {
    e.preventDefault();

    // Собираем данные из формы
    const request = {
      name: document.getElementById('name').value,
      apartment: document.getElementById('apartment').value,
      service: document.getElementById('service').value,
      comment: document.getElementById('comment').value || 'Без комментария',
      status: 'new',
      createdAt: new Date().toLocaleString('ru-RU')
    };

    // Загружаем текущие заявки (если их нет — создаём массив)
    const stored = JSON.parse(localStorage.getItem('conciergeRequests')) || [];

    // Добавляем новую
    stored.push(request);

    // Сохраняем обратно
    localStorage.setItem('conciergeRequests', JSON.stringify(stored));

    // Показываем уведомление
    successMsg.style.display = 'block';
    form.reset();

    // Скрываем уведомление через 3 секунды
    setTimeout(() => {
      successMsg.style.display = 'none';
    }, 3000);
  });
</script>

</body>
</html>
