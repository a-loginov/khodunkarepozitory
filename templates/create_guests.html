<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Создание пропуска — Сервисы Ходынки</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Montserrat", sans-serif;
      background-color: #f5f6f7;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
    }

    .cover {
      height: 35vh;
      min-height: 220px;
      background: linear-gradient(180deg, #2F80ED 0%, #56CCF2 100%);
      border-radius: 0 0 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .cover h1 {
      font-size: 1.8rem;
      margin: 0;
      font-weight: 700;
    }

    .cover p {
      font-size: 0.9rem;
      opacity: 0.95;
      margin-top: 6px;
    }

    .main-block {
      background: white;
      border-radius: 30px;
      padding: 30px 20px 60px;
      margin: -60px 15px 40px;
      position: relative;
      z-index: 1;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
    }

    .back-link {
      text-decoration: none;
      color: #2F80ED;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 20px;
    }

    .back-link:hover {
      text-decoration: underline;
    }

    label {
      display: block;
      font-weight: 600;
      margin-top: 16px;
      color: #333;
    }

    input, select, textarea {
      width: 100%;
      padding: 14px 16px;
      margin-top: 6px;
      border: 1px solid #e0e0e0;
      border-radius: 16px;
      font-size: 1rem;
      box-sizing: border-box;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #2F80ED;
      box-shadow: 0 0 0 3px rgba(47, 128, 237, 0.15);
    }

    .submit-btn {
      width: 100%;
      background: #2F80ED;
      color: white;
      border: none;
      border-radius: 16px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 25px;
      box-shadow: 0 6px 16px rgba(47, 128, 237, 0.25);
      transition: all 0.2s ease;
    }

    .submit-btn:hover {
      box-shadow: 0 10px 22px rgba(47, 128, 237, 0.3);
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="cover">
      <h1>📝 Создание пропуска</h1>
      <p>Введите данные гостя, чтобы оформить пропуск</p>
    </div>

    <div class="main-block">
      <a href="index.html" class="back-link">← Назад к сервисам</a>

      <form id="guestForm">
        <label for="fio">ФИО гостя</label>
        <input type="text" id="fio" placeholder="Введите ФИО" required>

        <label for="phone">Телефон</label>
        <input type="text" id="phone" placeholder="Введите номер телефона" required>

        <label for="people">Кто приедет</label>
        <select id="people" required>
          <option disabled selected>Выберите</option>
          <option>Курьер</option>
          <option>Друг</option>
          <option>Родственник</option>
          <option>Врач</option>
        </select>

        <label for="date">Дата визита</label>
        <input type="date" id="date" required>

        <label for="time">Время визита</label>
        <input type="time" id="time" required>

        <label for="comment">Комментарий (необязательно)</label>
        <textarea id="comment" rows="2" placeholder="Например: доставка цветов"></textarea>

        <button type="submit" class="submit-btn">Создать пропуск</button>
      </form>
    </div>
  </div>

  <script>
    const form = document.getElementById('guestForm');

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const guestData = {
        name: document.getElementById('fio').value,
        phone: document.getElementById('phone').value,
        type: document.getElementById('people').value,
        date: document.getElementById('date').value,
        time: document.getElementById('time').value,
        comment: document.getElementById('comment').value || 'Без комментариев'
      };

      // Сохраняем для отображения на странице пропуска
      localStorage.setItem('guestData', JSON.stringify(guestData));

      // Переход на страницу пропуска
      window.location.href = 'guest_pass.html';
    });
  </script>
</body>
</html>
