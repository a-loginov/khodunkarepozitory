<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Посылки — Сервисы Ходынки</title>

  <!-- Шрифт Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      background-color: #f2f5f3;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #f2f5f3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Верхняя обложка */
    .cover {
      height: 35vh;
      min-height: 240px;
      background: linear-gradient(180deg, #00bb5a 0%, #3fd676 100%);
      border-radius: 0 0 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .cover h1 {
      font-size: 2rem;
      margin: 0;
      font-weight: 700;
    }

    .cover p {
      font-size: 0.9rem;
      opacity: 0.95;
      margin-top: 6px;
    }

    /* Основной блок */
    .main-block {
      background: white;
      border-radius: 30px;
      padding: 30px 20px 60px;
      margin: -60px 15px 40px;
      position: relative;
      z-index: 1;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
      flex-grow: 1;
    }

    .main-block h2 {
      margin-top: 0;
      color: #333;
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* Список посылок */
    .parcel-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 15px;
    }

    .parcel-card {
      background: #fff8e1;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 3px 8px rgba(255, 179, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1rem;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .parcel-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 14px rgba(255, 179, 0, 0.3);
    }

    .parcel-info {
      flex-grow: 1;
      margin-left: 12px;
    }

    .parcel-info h3 {
      margin: 0;
      font-size: 1rem;
      color: #333;
    }

    .parcel-info p {
      margin: 4px 0 0;
      font-size: 0.85rem;
      color: #777;
    }

    .status {
      font-weight: 600;
      color: #00bb5a;
    }

    /* Кнопка */
    .add-btn {
      display: inline-block;
      background: linear-gradient(180deg, #3fd676 0%, #00bb5a 100%);
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      margin-top: 25px;
      transition: box-shadow 0.2s ease, transform 0.2s ease;
    }

    .add-btn:hover {
      box-shadow: 0 4px 12px rgba(255, 179, 0, 0.4);
      transform: translateY(-2px);
    }

    /* Ссылка "Назад" */
    .back-link {
      text-decoration: none;
      color: #00bb5a;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 20px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="cover">
      <h1>📦 Посылки</h1>
      <p>Отслеживайте ваши доставки прямо здесь</p>
    </div>

    <div class="main-block">
      <a href="index.html" class="back-link">← Назад к сервисам</a>
      <h2>Ваши активные посылки</h2>

      <div class="parcel-list">
        <div class="parcel-card">
          <span>🚚</span>
          <div class="parcel-info">
            <h3>Ozon — № 123456</h3>
            <p>Статус: <span class="status">в пути</span></p>
          </div>
        </div>

        <div class="parcel-card">
          <span>📦</span>
          <div class="parcel-info">
            <h3>Wildberries — № 987654</h3>
            <p>Статус: <span class="status">ожидает у консьержа</span></p>
          </div>
        </div>

        <div class="parcel-card">
          <span>✉️</span>
          <div class="parcel-info">
            <h3>AliExpress — № 552301</h3>
            <p>Статус: <span class="status">доставлено</span></p>
          </div>
        </div>
      </div>

      <a href="#" class="add-btn">Добавить новую посылку</a>
    </div>
  </div>
</body>
</html>
