<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Пропуск гостя — Сервисы Ходынки</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: "Montserrat", sans-serif;
      background-color: #f5f6f7;
      margin: 0;
      padding: 0;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
    }

    .cover {
      height: 35vh;
      min-height: 220px;
      background: linear-gradient(180deg, #00bb5a 0%, #3fd676 100%);
      border-radius: 0 0 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .cover h1 {
      font-size: 1.8rem;
      margin: 0;
      font-weight: 700;
    }

    .cover p {
      font-size: 0.9rem;
      opacity: 0.9;
      margin-top: 6px;
    }

    .main-block {
      background: white;
      border-radius: 30px;
      padding: 30px 20px 60px;
      margin: -50px 15px 40px;
      position: relative;
      z-index: 1;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
    }

    .pass-card {
      background: #f9fff9;
      border: 1px solid #d2f5db;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
    }

    .pass-card h3 {
      margin: 0 0 10px;
      color: #2c2c2c;
      font-size: 1.1rem;
    }

    .pass-card p {
      margin: 6px 0;
      font-size: 0.95rem;
      color: #333;
      line-height: 1.4;
    }

    .status {
      display: inline-block;
      padding: 6px 12px;
      border-radius: 12px;
      background: #eaffea;
      color: #00a14b;
      font-weight: 600;
      font-size: 0.9rem;
      margin-top: 10px;
    }

    .footer-note {
      margin-top: 35px;
      text-align: center;
      color: #555;
      font-size: 0.95rem;
      line-height: 1.4;
      font-weight: 500;
    }

    .footer-note .confirm-icon {
      font-size: 1.8rem;
      margin-top: 10px;
      color: #00bb5a;
      text-shadow: 0 0 8px rgba(0, 187, 90, 0.35);
      animation: appear 0.8s ease-out;
    }

    @keyframes appear {
      0% { transform: scale(0.5); opacity: 0; }
      60% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(1); }
    }

    .back-link {
      text-decoration: none;
      color: #00bb5a;
      font-weight: 600;
      display: inline-block;
      margin-bottom: 20px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="cover">
      <h1>🎫 Пропуск гостя</h1>
      <p>Информация о визите</p>
    </div>

    <div class="main-block">
      <a href="index.html" class="back-link">← Назад к сервисам</a>
      
      <div class="pass-card" id="passInfo">
        <h3>Имя гостя: <span id="guestName">—</span></h3>
        <p><strong>Телефон:</strong> <span id="guestPhone">—</span></p>
        <p><strong>Тип гостя:</strong> <span id="guestType">—</span></p>
        <p><strong>Дата визита:</strong> <span id="guestDate">—</span></p>
        <p><strong>Время визита:</strong> <span id="guestTime">—</span></p>
        <p><strong>Комментарий:</strong> <span id="guestComment">—</span></p>

        <div class="status">Одобрен ✅</div>
      </div>

      <div class="footer-note">
        <div class="confirm-icon">✅</div>
        <p>Покажите этот пропуск консьержу при входе в здание.</p>
      </div>
    </div>
  </div>

  <script>
    const data = JSON.parse(localStorage.getItem('guestData'));
    
    if (data) {
      document.getElementById('guestName').textContent = data.name || '—';
      document.getElementById('guestPhone').textContent = data.phone || '—';
      document.getElementById('guestType').textContent = data.type || '—';
      document.getElementById('guestDate').textContent = data.date || '—';
      document.getElementById('guestTime').textContent = data.time || '—';
      document.getElementById('guestComment').textContent = data.comment || 'Без комментариев';

      // Сохраняем пропуск в список для консьержа
      const passes = JSON.parse(localStorage.getItem('guestPasses')) || [];
      passes.push(data);
      localStorage.setItem('guestPasses', JSON.stringify(passes));
    }
  </script>
</body>
</html>
