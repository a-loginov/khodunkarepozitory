<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сервисы Ходынки</title>

  <!-- Подключение шрифта Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      margin: 0;
      font-family: "Montserrat", sans-serif;
      background-color: #f2f5f3;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: #f2f5f3;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .cover {
      height: 35vh;
      min-height: 260px;
      background: linear-gradient(180deg, #00bb5a 0%, #3fd676 100%);
      border-radius: 0 0 30px 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
    }

    .cover h1 {
      font-size: 1.9rem;
      margin: 0;
      font-weight: 700;
    }

    .cover p {
      font-size: 0.95rem;
      opacity: 0.9;
      margin-top: 8px;
    }

    .main-block {
      background: #fff;
      border-radius: 30px;
      padding: 30px 20px 60px;
      margin: -60px 15px 40px;
      position: relative;
      z-index: 1;
      box-shadow: 0 -6px 20px rgba(0, 0, 0, 0.08);
      flex-grow: 1;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 16px;
    }

    .menu-card {
      background: #fff;
      border-radius: 20px;
      text-align: center;
      padding: 26px 10px;
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.06);
      text-decoration: none;
      color: #333;
      transition: all 0.25s ease;
      font-size: 1.05rem;
      display: block;
    }

    .menu-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.1);
    }

    .menu-card span.emoji {
      font-size: 2.3rem;
      display: block;
      margin-bottom: 8px;
    }

    .menu-card span.label {
      font-weight: 600;
    }

    /* Нижнее меню (опционально) */
    .bottom-menu {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #fff;
      padding: 10px 20px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-radius: 24px 24px 0 0;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.08);
      z-index: 10;
    }

    .menu-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #888;
      font-size: 1.3rem;
      transition: color 0.2s ease;
    }

    .menu-item.active {
      color: #00bb5a;
    }

    .menu-item span.label {
      font-size: 0.8rem;
      font-weight: 500;
      margin-top: 2px;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="cover">
      <h1>Сервисы Ходынки</h1>
      <p>Все удобства вашего дома — в одном месте</p>
    </div>

    <div class="main-block">
      <div class="menu-grid">
        <a href="create_guests.html" class="menu-card">
          <span class="emoji">📝</span>
          <span class="label">Заявка для гостей</span>
        </a>

        <a href="concierge.html" class="menu-card">
          <span class="emoji">🛎️</span>
          <span class="label">Консьерж</span>
        </a>

        <a href="housing.html" class="menu-card">
          <span class="emoji">🏠</span>
          <span class="label">Заявки в ЖКХ</span>
        </a>

        <a href="delivery.html" class="menu-card">
          <span class="emoji">📦</span>
          <span class="label">Посылки</span>
        </a>

        <a href="parking.html" class="menu-card">
          <span class="emoji">🚗</span>
          <span class="label">Паркинг</span>
        </a>

        <a href="events.html" class="menu-card">
          <span class="emoji">🎉</span>
          <span class="label">События</span>
        </a>
      </div>
    </div>
  </div>

  <!-- Нижнее меню (если нужно) -->
  
  <div class="bottom-menu">
    <a href="#" class="menu-item active">
      <span>🏠</span>
      <span class="label">Главная</span>
    </a>
    <a href="#" class="menu-item">
      <span>💬</span>
      <span class="label">Чат</span>
    </a>
    <a href="#" class="menu-item">
      <span>👤</span>
      <span class="label">Профиль</span>
    </a>
  </div>
  
</body>
</html>
